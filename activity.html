    const listEl = document.getElementById('activityList');
    const detailEl = document.getElementById('activityDetail');
    const detailContent = document.getElementById('detailContent');
    const backBtn = document.getElementById('backToList');
    const filterBar = document.getElementById('activityFilter');

    // 渲染活动列表
    function renderList(filter) {
      if (!listEl) return;
      const items = filter === 'all' ? activities : activities.filter(a => a.badge === filter);
      listEl.innerHTML = items.map((a, idx) => `
        <div class="activity-card" data-id="${a.id}" data-badge="${a.badge}" style="animation-delay:${idx * 0.05}s;">
          <div class="activity-card-head">
            <h3>${a.title}</h3>
            <span class="activity-badge badge-${a.badge}">${a.badgeText}</span>
          </div>
          <div class="activity-meta">
            <span>📅 ${a.date}</span>
            <span>🏷 ${a.tag}</span>
          </div>
          <p class="activity-desc">${a.desc}</p>
          <a class="activity-link" href="javascript:void(0)" data-goto="${a.id}">查看详情 ›</a>
        </div>
      `).join('');
    }

    // 渲染活动详情
    function renderDetail(id) {
      const a = activities.find(x => x.id === id);
      if (!a) { showList(); return; }
      detailContent.innerHTML = `
        <div class="detail-head">
          <h2>${a.title}</h2>
          <div class="detail-meta">
            <span><span class="activity-badge badge-${a.badge}">${a.badgeText}</span></span>
            <span>📅 ${a.date}</span>
            <span>🏷 ${a.tag}</span>
          </div>
        </div>
        ${a.content}
      `;
      listEl.style.display = 'none';
      detailEl.style.display = 'block';
      filterBar.style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showList() {
      detailEl.style.display = 'none';
      listEl.style.display = 'block';
      filterBar.style.display = 'flex';
      renderList(currentFilter);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('scroll', function() {
      if (listEl.style.display === 'none') return;
      const cards = document.querySelectorAll('.activity-card');
      let current = 'all';
      cards.forEach(card => {
        if (card.getBoundingClientRect().top < 120) {
          current = card.dataset.id;
        }
      });
      // 高亮当前卡片
      cards.forEach(card => card.classList.remove('highlight'));
      const active = document.querySelector(`.activity-card[data-id="${current}"]`);
      if (active) active.classList.add('highlight');
    });

    // 事件绑定
    let currentFilter = 'all';
    filterBar.addEventListener('click', function(e) {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderList(currentFilter);
    });

    listEl.addEventListener('click', function(e) {
      const link = e.target.closest('[data-goto]');
      const card = e.target.closest('.activity-card');
      if (link) {
        renderDetail(link.dataset.goto);
      } else if (card) {
        renderDetail(card.dataset.id);
      }
    });

    backBtn.addEventListener('click', showList);

    // 支持 URL 参数定位：?act=活动id 或 #活动id
    function initFromHash() {
      const params = new URLSearchParams(window.location.search);
      const act = params.get('act') || (window.location.hash ? window.location.hash.slice(1) : '');
      if (act && activities.find(x => x.id === act)) {
        renderDetail(act);
      }
    }

    renderList('all');
    initFromHash();
  </script>
