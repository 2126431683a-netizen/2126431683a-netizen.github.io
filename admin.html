  <style>

    .act-item .title { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<body>
  <div class="wrap">
    <header class="top">
      <div class="logo">放开那个女巫<small>公告管理后台 · GitHub 驱动 CMS</small></div>
      <div class="top-actions">
        <a class="btn" href="index.html">← 返回官网</a>
        <a class="btn" href="activity.html">查看公告页</a>
      </div>
    </header>

    <!-- 连接配置 -->
    <section class="card">
      <h3>连接 GitHub</h3>
      <p style="color:var(--muted);font-size:0.85rem;margin-bottom:0.4rem;">本后台通过 GitHub API 读写站点根目录的 <code>assets/activities.json</code>。需要你的 GitHub 个人访问令牌（Token）。令牌仅保存在你本机浏览器中，不会上传到服务器。</p>
      <label>GitHub 个人访问令牌（需要 repo 写权限）</label>
      <div class="row">
        <div style="flex:3"><input type="password" id="ghToken" placeholder="ghp_... 或 github_pat_..." autocomplete="off"></div>
        <div style="flex:1"><button class="btn btn-primary" id="saveTokenBtn">保存令牌</button></div>
      </div>
      <label>仓库（仅需修改时填写，默认已配置）</label>
      <input type="text" id="repoInput" placeholder="owner/repo，如 2126431683a-netizen/2126431683a-netizen.github.io">
      <button class="btn" id="loadBtn" style="margin-top:0.8rem;">从 GitHub 加载公告</button>
      <div class="status" id="connStatus"></div>
    </section>

    <!-- 公告列表 -->
    <section class="card">
      <div class="list-head">
        <h3 style="margin:0;">公告列表 <span class="muted" id="countText"></span></h3>
        <button class="btn btn-primary" id="newBtn">＋ 新增公告</button>
      </div>
      <div id="actList"></div>
      <div class="status" id="listStatus"></div>
    </section>

    <!-- 编辑器 -->
    <section class="card" id="editorCard" style="display:none;">
      <h3 id="editorTitle">编辑公告</h3>
      <div class="row">
        <div style="flex:2"><label>标题</label><input type="text" id="fTitle"></div>
        <div style="flex:1"><label>ID（唯一，英文小写，用于链接）</label><input type="text" id="fId"></div>
      </div>
      <div class="row">
        <div><label>徽章类型</label>
          <select id="fBadge">
            <option value="new">最新</option>
            <option value="event">活动</option>
            <option value="update">更新</option>
            <option value="teaser">预告</option>
          </select>
        </div>
        <div><label>徽章文本</label><input type="text" id="fBadgeText"></div>
        <div><label>时间</label><input type="text" id="fDate" placeholder="如 2027年8月5日 - 2027年8月20日"></div>
        <div><label>标签</label><input type="text" id="fTag" placeholder="如 活动 · 庆典"></div>
      </div>
      <label>摘要（列表页展示）</label>
      <textarea id="fDesc" rows="2"></textarea>
      <label>温馨提示（详情页底部，可留空）</label>
      <input type="text" id="fNote">

      <div class="sections-wrap" id="sectionsWrap"></div>
      <div class="editor-toolbar">
        <button class="btn" id="addSecBtn">＋ 添加内容版块</button>
        <button class="btn btn-primary" id="saveBtn">保存到 GitHub</button>
        <button class="btn" id="cancelBtn">取消</button>
      </div>
      <div class="status" id="editorStatus"></div>
    </section>
  </div>

  <script>
    var REPO = '2126431683a-netizen/2126431683a-netizen.github.io';
    var FILE = 'assets/activities.json';
    var PAGE_PATH = 'assets/activities.json';
    var activities = [];   // 当前缓存
    var editingId = null;  // null = 新增

    // ---------- 工具 ----------
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function setStatus(elId, msg, ok) {
      var el = $(elId);
      el.className = 'status ' + (ok ? 'ok' : 'err');
      el.textContent = msg;
    }
    function getToken() { return localStorage.getItem('gh_admin_token') || ''; }

    // ---------- 连接配置 ----------
    $('saveTokenBtn').addEventListener('click', function() {
      var t = $('ghToken').value.trim();
      if (!t) { setStatus('connStatus', '请填写令牌', false); return; }
      localStorage.setItem('gh_admin_token', t);
      setStatus('connStatus', '令牌已保存到本机浏览器。', true);
      $('ghToken').value = '';
      loadFromGitHub();
    });

    // 从 GitHub 读取当前文件内容与 sha
    async function fetchFile() {
      var token = getToken();
      if (!token) throw new Error('未配置令牌');
      var url = 'https://api.github.com/repos/' + REPO + '/contents/' + FILE;
      var res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) throw new Error('读取失败 HTTP ' + res.status + '：' + (await res.text()).slice(0, 200));
      return await res.json();
    }

    async function loadFromGitHub() {
      setStatus('connStatus', '加载中…', true);
      try {
        var meta = await fetchFile();
        var raw = decodeURIComponent(escape(atob(meta.content)));
        var data = JSON.parse(raw);
        activities = (data && Array.isArray(data.activities)) ? data.activities : [];
        renderList();
        setStatus('connStatus', '已加载 ' + activities.length + ' 条公告。', true);
      } catch (e) {
        setStatus('connStatus', '加载失败：' + e.message, false);
      }
    }
    $('loadBtn').addEventListener('click', loadFromGitHub);

    // ---------- 列表渲染 ----------
    function badgeText(b) {
      return { new:'最新', event:'活动', update:'更新', teaser:'预告' }[b] || b || '活动';
    }
    function renderList() {
      var box = $('actList');
      $('countText').textContent = '（' + activities.length + ' 条）';
      if (!activities.length) { box.innerHTML = '<p style="color:var(--muted)">暂无可编辑的公告，请先点击「从 GitHub 加载公告」。</p>'; return; }
      box.innerHTML = activities.map(function(a, i) {
        return '<div class="act-item">' +
          '<span class="badge">' + esc(a.badgeText || badgeText(a.badge)) + '</span>' +
          '<span class="title">' + esc(a.title) + '</span>' +
          '<span class="ops">' +
            '<button class="btn btn-sm" data-edit="' + i + '">编辑</button>' +
            '<button class="btn btn-sm btn-danger" data-del="' + i + '">删除</button>' +
          '</span>' +
        '</div>';
      }).join('');
    }
    $('actList').addEventListener('click', function(e) {
      var ed = e.target.closest('[data-edit]');
      var dl = e.target.closest('[data-del]');
      if (ed) { openEditor(activities[+ed.dataset.edit]); }
      else if (dl) {
        var a = activities[+dl.dataset.del];
        if (confirm('确定删除公告「' + a.title + '」？此操作将写入 GitHub。')) {
          activities.splice(+dl.dataset.del, 1);
          renderList();
          setStatus('listStatus', '已从列表移除，点击下方编辑器的「保存到 GitHub」使线上生效。', true);
        }
      }
    });

    // ---------- 编辑器 ----------
    function defaultSection() { return { type: 'text', heading: '活动介绍', text: '' }; }

    function renderSections() {
      var wrap = $('sectionsWrap');
      var secs = currentSections;
      wrap.innerHTML = secs.map(function(s, i) {
        var bodyHtml = '';
        var hint = '';
        if (s.type === 'rewards') {
          var lines = (s.items || []).map(function(it){ return it.name + ' — ' + it.desc; }).join('\n');
          bodyHtml = '<textarea rows="3" data-sec="' + i + '" data-field="rewards">' + esc(lines) + '</textarea>';
          hint = '每行一条：奖励名 — 获取方式';
        } else if (s.type === 'list') {
          var items = (s.items || []).join('\n');
          bodyHtml = '<textarea rows="3" data-sec="' + i + '" data-field="list">' + esc(items) + '</textarea>';
          hint = '每行一条项目';
        } else {
          bodyHtml = '<textarea rows="2" data-sec="' + i + '" data-field="text">' + esc(s.text || '') + '</textarea>';
        }
        return '<div class="sec">' +
          '<div class="sec-top">' +
            '<select data-sec="' + i + '" data-field="type">' +
              '<option value="text"' + (s.type==='text'?' selected':'') + '>段落</option>' +
              '<option value="list"' + (s.type==='list'?' selected':'') + '>列表</option>' +
              '<option value="rewards"' + (s.type==='rewards'?' selected':'') + '>奖励</option>' +
            '</select>' +
            '<input type="text" value="' + esc(s.heading) + '" placeholder="版块标题，如 活动介绍" data-sec="' + i + '" data-field="heading">' +
            '<button class="btn btn-sm btn-danger" data-remsc="' + i + '">×</button>' +
          '</div>' +
          '<div class="sec-body">' + bodyHtml + '</div>' +
          '<div class="sec-hint">' + hint + '</div>' +
        '</div>';
      }).join('');
    }

    var currentSections = [];

    $('sectionsWrap').addEventListener('input', syncSectionInput);
    $('sectionsWrap').addEventListener('change', syncSectionInput);
    function syncSectionInput(e) {
      var el = e.target;
      var i = +el.dataset.sec;
      var f = el.dataset.field;
      if (f === 'type') { currentSections[i].type = el.value; renderSections(); return; }
      if (f === 'heading') { currentSections[i].heading = el.value; return; }
      if (f === 'text') { currentSections[i].text = el.value; return; }
      if (f === 'list') { currentSections[i].items = el.value.split('\n').map(function(x){return x.trim();}).filter(Boolean); return; }
      if (f === 'rewards') {
        currentSections[i].items = el.value.split('\n').map(function(line){
          var idx = line.indexOf('—');
          if (idx > -1) return { name: line.slice(0, idx).trim(), desc: line.slice(idx + 1).trim() };
          return { name: line.trim(), desc: '' };
        }).filter(function(x){ return x.name || x.desc; });
      }
    }
    $('sectionsWrap').addEventListener('click', function(e) {
      var rm = e.target.closest('[data-remsc]');
      if (rm) { currentSections.splice(+rm.dataset.remsc, 1); renderSections(); }
    });
    $('addSecBtn').addEventListener('click', function() { currentSections.push(defaultSection()); renderSections(); });

    function openEditor(a) {
      editingId = a ? a.id : null;
      $('editorTitle').textContent = a ? '编辑公告：' + a.title : '新增公告';
      $('fTitle').value = a ? a.title : '';
      $('fId').value = a ? a.id : '';
      $('fBadge').value = a ? a.badge : 'event';
      $('fBadgeText').value = a ? a.badgeText : '';
      $('fDate').value = a ? a.date : '';
      $('fTag').value = a ? a.tag : '';
      $('fDesc').value = a ? a.desc : '';
      $('fNote').value = a ? a.note : '';
      currentSections = a && Array.isArray(a.sections) ? JSON.parse(JSON.stringify(a.sections)) : [defaultSection()];
      renderSections();
      $('editorCard').style.display = 'block';
      $('editorCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    $('newBtn').addEventListener('click', function() { openEditor(null); });
    $('cancelBtn').addEventListener('click', function() { $('editorCard').style.display = 'none'; });

    $('saveBtn').addEventListener('click', async function() {
      var title = $('fTitle').value.trim();
      var id = $('fId').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
      if (!title) { setStatus('editorStatus', '请填写标题', false); return; }
      if (!id) { setStatus('editorStatus', '请填写 ID（英文小写）', false); return; }
      var obj = {
        id: id,
        title: title,
        badge: $('fBadge').value,
        badgeText: $('fBadgeText').value.trim() || badgeText($('fBadge').value),
        date: $('fDate').value.trim(),
        tag: $('fTag').value.trim(),
        desc: $('fDesc').value.trim(),
        note: $('fNote').value.trim(),
        sections: currentSections.filter(function(s){ return s.heading || (s.text||'').trim() || (s.items||[]).length; })
      };
      if (editingId) {
        var idx = activities.findIndex(function(x){ return x.id === editingId; });
        if (idx > -1) { obj.id = activities[idx].id; obj.title = title; activities[idx] = obj; }
      } else {
        if (activities.some(function(x){ return x.id === id; })) { setStatus('editorStatus', 'ID 已存在，请更换', false); return; }
        activities.push(obj);
      }
      // 排序：按 date（近似），保持手动顺序即可
      setStatus('editorStatus', '正在写入 GitHub…', true);
      try { await saveToGitHub(); $('editorCard').style.display = 'none'; renderList(); setStatus('listStatus', '保存成功！刷新官网首页与公告页即可看到最新内容。', true); }
      catch (e) { setStatus('editorStatus', '保存失败：' + e.message, false); }
    });

    async function saveToGitHub() {
      var token = getToken();
      if (!token) throw new Error('请先在上方配置 GitHub 令牌');
      var meta;
      try { meta = await fetchFile(); } catch (e) { meta = null; }
      var payload = { updated: new Date().toISOString().slice(0, 10), activities: activities };
      var jsonStr = JSON.stringify(payload, null, 2);
      var body = { message: 'bot: 更新公告', content: btoa(unescape(encodeURIComponent(jsonStr))), branch: 'main' };
      if (meta && meta.sha) body.sha = meta.sha;
      var res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('写入 GitHub 失败 HTTP ' + res.status + '：' + (await res.text()).slice(0, 200));
    }

    // 初始化：读取本机令牌
    $('ghToken').value = ''; // 不回显已存令牌
    renderList();
  </script>
</body>
</html>
