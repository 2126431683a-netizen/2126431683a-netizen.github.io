<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="陈黄勇 · 游戏产品经理 / 运营策划 / 系统策划。一个星系：每个星球是一段能力与作品的入口。">
  <meta property="og:title" content="陈黄勇 | CHY Galaxy">
  <meta property="og:description" content="点击星球，展开游戏产品、运营策划与系统策划的作品星系。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://2126431683a-netizen.github.io/">
  <title>陈黄勇 | CHY Galaxy</title>
  <link rel="stylesheet" href="assets/site.css?v=2026-08-27-18">
  <script src="assets/site.js?v=2026-08-27-19" defer></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <main id="main" class="scene-flow" aria-label="CHY galaxy">

    <section class="scene scene-hero" id="scene-hero" aria-label="陈黄勇">
      <div class="starfield" aria-hidden="true"></div>
      <div class="shell scene-hero-grid">
        <h1 class="hero-title">
          <span class="hero-name">CHY.GALAXY</span>
          <span class="hero-line">陈黄勇</span>
          <span class="hero-line hero-dim">游戏产品 · 运营 · 系统</span>
        </h1>
        <div class="hero-side">
          <p class="hero-pixel"><span data-type data-type-speed="70">Build</span><br><span data-type data-type-speed="70">playable</span><br><span data-type data-type-speed="70">systems.</span></p>
          <p class="hero-note">作品与能力不直接铺在页面上——它们被收进各个星球。进入星系，点击任意星球展开详情。</p>
          <div class="hero-facts" aria-label="档案概览">
            <div><strong>06</strong><span>项目档案</span></div>
            <div><strong>05</strong><span>可运行 Demo</span></div>
            <div><strong>30%</strong><span>内容上过热搜</span></div>
          </div>
        </div>
      </div>
      <button class="swipe-hint" type="button" data-goto="scene-solar" aria-label="进入星系">
        <span>进入星系</span>
        <img src="assets/fonts/pixel-arrow-right.svg" alt="" aria-hidden="true" class="pixel-arrow pixel-arrow-down">
      </button>
    </section>

    <section class="scene scene-solar" id="scene-solar" aria-label="作品星系">
      <div class="starfield starfield-dense" aria-hidden="true"></div>

      <div class="solar-universe" data-solar>
        <p class="solar-title" data-solar-title>CHY GALAXY / 选择一颗星球</p>

        <div class="solar-stage" data-solar-stage role="list" aria-label="星球列表">
          <div class="orbit orbit-1" aria-hidden="true"></div>
          <div class="orbit orbit-2" aria-hidden="true"></div>
          <div class="orbit orbit-3" aria-hidden="true"></div>

          <button class="sun" type="button" role="listitem" data-planet="sun" style="--angle: 0deg; --dist: 0px">
            <span class="sun-glow" aria-hidden="true"></span>
            <span class="sun-core" aria-hidden="true"></span>
            <span class="planet-label">CHY<span class="planet-tag">恒星 / 关于我</span></span>
          </button>
          <button class="planet planet-p1" type="button" role="listitem" data-planet="projects" style="--angle: 24deg; --dist: 170px">
            <span class="planet-core" aria-hidden="true"></span>
            <span class="planet-label">PROJECTS<span class="planet-tag">项目终端</span></span>
          </button>
          <button class="planet planet-p2" type="button" role="listitem" data-planet="skills" style="--angle: 82deg; --dist: 262px">
            <span class="planet-core" aria-hidden="true"></span>
            <span class="planet-label">SKILLS<span class="planet-tag">技能树</span></span>
          </button>
          <button class="planet planet-p3" type="button" role="listitem" data-planet="ops" style="--angle: 138deg; --dist: 170px">
            <span class="planet-core" aria-hidden="true"></span>
            <span class="planet-label">OPS<span class="planet-tag">运营策划</span></span>
          </button>
          <button class="planet planet-p4" type="button" role="listitem" data-planet="story" style="--angle: 196deg; --dist: 262px">
            <span class="planet-core" aria-hidden="true"></span>
            <span class="planet-label">STORY<span class="planet-tag">经历</span></span>
          </button>
          <button class="planet planet-p5" type="button" role="listitem" data-planet="lens" style="--angle: 252deg; --dist: 170px">
            <span class="planet-core" aria-hidden="true"></span>
            <span class="planet-label">LENS<span class="planet-tag">游戏理解</span></span>
          </button>
          <button class="planet planet-p6" type="button" role="listitem" data-planet="link" style="--angle: 310deg; --dist: 262px">
            <span class="planet-core" aria-hidden="true"></span>
            <span class="planet-label">LINK<span class="planet-tag">联系</span></span>
          </button>
        </div>

        <div class="planet-focus" data-planet-focus aria-hidden="true">
          <span class="focus-core" aria-hidden="true"></span>
          <span class="focus-ring" aria-hidden="true"></span>
        </div>

        <aside class="planet-panel" data-planet-panel hidden>
          <header class="panel-head">
            <p class="panel-code" data-panel-code>Planet 01</p>
            <h2 class="panel-title" data-panel-title>项目终端</h2>
            <button class="panel-close" type="button" data-planet-close aria-label="返回星系">
              <img src="assets/fonts/pixel-arrow-left.svg" alt="" aria-hidden="true" class="pixel-arrow">
              <span>返回星系</span>
            </button>
          </header>
          <div class="panel-body" data-panel-body></div>
        </aside>
      </div>
    </section>


  </main>
</body>
</html>
